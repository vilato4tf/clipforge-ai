<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipForge AI</title>
    <style>
        body {
            background: #10111b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 15px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1d2030;
            padding: 30px;
            border-radius: 15px;
        }
        h1 { color: #8b7cff; }
        input, button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
        }
        button {
            background: #7865ff;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClipForge AI</h1>
        <p>Turn long gaming videos and livestreams into short clips.</p>

        <input type="url" placeholder="Paste your video URL here">

        <button onclick="alert('Video processing will be added next!')">
            Generate Clips
        </button>
        <p>Free AI Gaming Clip Generator</p>
    </div>
</body>
</html>
